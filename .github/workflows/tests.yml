name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    # Training needs a CUDA GPU; CI covers the CPU path: archived analysis,
    # Sim(3) alignment math, orchestration logic and script portability.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - run: uv sync --locked --extra analysis
      - run: uv run python -m unittest discover -s tests -p "test_script_portability.py" -v
      - run: uv run python -m unittest discover -s tests -p "test_orchestration.py" -v
      - run: uv run python -m unittest discover -s tests -p "test_alignment.py" -v
      - run: uv run python scripts/analysis/analyze_warmup_results.py --plots
      - run: uv run python scripts/showcase/make_figures.py --output "$RUNNER_TEMP/figures"
